<html class="dark" lang="en"><head>

<style>
        .primary-glow {
            box-shadow: 0px 0px 8px rgba(218, 119, 86, 0.4);
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23a38c85' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col items-center justify-center p-md">
<!-- Brand Header -->
<header class="mb-xl text-center">
<h1 class="font-wordmark text-[40px] leading-tight font-bold text-primary-container uppercase tracking-tighter">
            GrindOS
        </h1>
<p class="font-wordmark text-label-caps text-text-secondary mt-xs">
            built for the grind.
        </p>
</header>
<!-- Onboarding Card -->
<main class="w-full max-w-[480px]">
<div class="bg-surface-container-low border border-border-subtle rounded-xl p-xl shadow-2xl">
<form class="space-y-lg">
<!-- Name Input Section -->
<div class="space-y-sm">
<label class="font-wordmark text-headline-md text-on-surface lowercase" for="name">
                        what should we call you?
                    </label>
<input class="w-full bg-background border border-border-subtle rounded-lg px-md py-sm font-wordmark text-code-sm text-on-surface placeholder:text-text-muted focus:border-primary-container focus:ring-0 transition-colors" id="name" placeholder="your name..." type="text"/>
</div>
<!-- Divider -->
<hr class="border-t border-border-subtle my-lg"/>
<!-- Optional Section -->
<div class="space-y-md">
<span class="font-wordmark text-label-caps text-text-secondary lowercase">
                        a few more things (optional)
                    </span>
<!-- Coding Goal Dropdown -->
<div class="space-y-xs">
<label class="font-wordmark text-label-caps text-text-muted lowercase">primary goal</label>
<select class="w-full bg-background border border-border-subtle rounded-lg px-md py-sm font-wordmark text-code-sm text-on-surface focus:border-primary-container focus:ring-0 transition-colors">
<option disabled="" selected="" value="">select your path...</option>
<option>Get an internship</option>
<option>Crack FAANG</option>
<option>Personal growth</option>
<option>Other</option>
</select>
</div>
<!-- Language Dropdown -->
<div class="space-y-xs">
<label class="font-wordmark text-label-caps text-text-muted lowercase">weapon of choice</label>
<select class="w-full bg-background border border-border-subtle rounded-lg px-md py-sm font-wordmark text-code-sm text-on-surface focus:border-primary-container focus:ring-0 transition-colors">
<option disabled="" selected="" value="">select language...</option>
<option>Java</option>
<option>Python</option>
<option>C++</option>
<option>JavaScript</option>
<option>Go</option>
</select>
</div>
<!-- Daily Goal Input -->
<div class="space-y-xs">
<label class="font-wordmark text-label-caps text-text-muted lowercase">daily grind volume</label>
<div class="relative flex items-center">
<input class="w-full bg-background border border-border-subtle rounded-lg px-md py-sm font-wordmark text-code-sm text-on-surface placeholder:text-text-muted focus:border-primary-container focus:ring-0 transition-colors" placeholder="0" type="number"/>
<span class="absolute right-md font-wordmark text-label-caps text-text-muted lowercase pointer-events-none">
                                problems / day
                            </span>
</div>
</div>
</div>
<!-- Submit Action -->
<div class="pt-md">
<button class="w-full bg-primary-container hover:bg-opacity-90 text-on-primary-container font-wordmark font-bold text-headline-md py-md rounded-lg primary-glow transition-all active:scale-[0.98] flex items-center justify-center gap-sm" type="submit">
                        Start Grinding
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="mt-xl">
<p class="font-wordmark text-[10px] text-text-muted tracking-widest uppercase">
            your data stays on your machine. always.
        </p>
</footer>
</body></html>
